name: Cascade
description: 'Cascade (www.cascade.io) was a no-code data analysis platform founded in 2019 by
  Jake Fuentes and Jon Brelig that let non-technical business teams import large datasets, transform
  and combine them with no-code tools, then visualize and present findings as interactive data apps
  (positioned as a cloud-native, collaborative alternative to Alteryx). The company wound down in 2023
  after failing to reach breakout growth; www.cascade.io now serves a retrospective "What Cascade Did"
  page. As of the 2026-07-18 enrichment probe there is no public API, developer portal, API reference,
  SDKs, or documentation surface to enrich, so this profile carries identity only.'
